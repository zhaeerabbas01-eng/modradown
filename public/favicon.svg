<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="modraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6650ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#a855f7" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background squircle with branded gradient stroke -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#modraGrad)" stroke-width="2" />

  <!-- ModraDown Distinctive 'M' + Downloader Emblem -->
  <g filter="url(#glow)">
    <!-- Main M outline -->
    <path d="M15 48V16L32 32L49 16V48" 
          fill="none" 
          stroke="url(#modraGrad)" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Central Download Arrow Accent -->
    <path d="M26 38L32 44L38 38" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
